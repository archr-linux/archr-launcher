# Grafite. Every field is optional and inherits individually from the builtin.
# docs/temas.md describes every key.
name = "Grafite"
# Colors are #RRGGBB or #RRGGBBAA; accent/highlight_bg, accent_text/highlight_text
# and dim/dim_text are aliases (the new spelling takes precedence).
background = "#0B0F14"
surface = "#11161C"
surface_elevated = "#161C23"
border = "#1C232C"
badge = "#1C2530"
text = "#E6EDF3"
text_secondary = "#C5CFDA"
muted = "#9BA7B4"
dim = "#6B7785"
accent = "#1E88FF"
accent_text = "#FFFFFF"
accent_text_secondary = "#CFE4FF"
success = "#3FB950"
warning = "#D29922"
danger = "#F85149"
scrim = "#05080B99" # notices; quick menu uses 1.2x opacity (~0.72)

# Official static Inter 4.1 and JetBrains Mono 2.304, under the adjacent OFLs.
# Paths stay relative to the theme; missing fonts use Liberation/DejaVu.
font = "fonts/Inter-Regular.ttf"
font_semibold = "fonts/Inter-SemiBold.ttf"
font_mono = "fonts/JetBrainsMono-Regular.ttf"
font_mono_medium = "fonts/JetBrainsMono-Medium.ttf"

# Dimensions are screen-height fractions (reference: 480px).
font_size = 0.035416667 # 17px interface; games use 16px, selected +1px
margin = 0.033333333 # 16px
radius_item = 0.020833333 # 10px
radius_card = 0.033333333 # 16px; cover uses 12px
header_height = 0.091666667 # 44px
footer_height = 0.1 # 48px
row_height = 0.079166667 # 38px systems
selected_height = 0.091666667 # 44px systems
game_row_height = 0.075 # 36px games
game_selected_height = 0.0875 # 42px games
# Widths/x use screen-width fractions; y/heights use screen-height fractions.
list_width = 0.590625 # 378px, plus 16px gap to the cover
cover = { x = 0.640625, y = 0.1125, w = 0.328125, h = 0.583333333 }
system_screen = "list"
# Style: corner radii times corners (0 = square), panel border thickness in
# reference pixels (1-8), shadow under panels ("soft", "hard" or "none"),
# console pictures scaled "smooth" or "pixel" (no smoothing) and motion
# "smooth" (ease-out) or "steps" (in four jumps).
corners = 1.0
border_width = 1
shadow = "soft"
art_scaling = "smooth"
image_scaling = "smooth"
easing = "smooth"
# Text: sizes times font_scale (0.5-2), snapped to multiples of font_grid
# reference pixels (0 = free), drawn without anti-aliasing when
# font_smoothing = false. text_outline, background_image and [frames.*]
# are described in docs/temas.md.
font_scale = 1.0
font_grid = 0
font_min = 8 # smallest text, in px; what does not fit wraps
font_smoothing = true
# Game details (Jogo-detalhes): left column 24px+250px, right column 292px+324px.
details_shot = { x = 0.0375, y = 0.104166667, w = 0.390625, h = 0.3125 } # 150px tall
details_info = { x = 0.0375, y = 0.4375, w = 0.390625, h = 0.445833333 }
details_title = { x = 0.45625, y = 0.104166667, w = 0.50625, h = 0.095833333 } # 46px
details_subtitle = { x = 0.45625, y = 0.216666667, w = 0.50625, h = 0.033333333 }
details_text = { x = 0.45625, y = 0.266666667, w = 0.50625, h = 0.529166667 }
details_actions = { x = 0.45625, y = 0.8125, w = 0.50625, h = 0.070833333 } # 34px
# Start menu module widgets (Start-widget): 444x104px at 98,218.
start_widgets = { x = 0.153125, y = 0.454166667, w = 0.69375, h = 0.216666667 }
# Start menu: the box its title, tiles and shortcuts are centered in.
start_area = { x = 0.0, y = 0.0, w = 1.0, h = 1.0 }
# Game achievements (RA-jogo): progress over a 604px column, list of 50px rows below.
achievements_progress = { x = 0.025, y = 0.108333333, w = 0.94375, h = 0.0625 }
achievements_list = { x = 0.025, y = 0.183333333, w = 0.94375, h = 0.7125 }
# Game saves (Saves): list 312px at 12,48 with 62px rows, state card 282px beside it.
saves_list = { x = 0.01875, y = 0.1, w = 0.4875, h = 0.783333333 }
saves_card = { x = 0.53125, y = 0.1, w = 0.440625, h = 0.783333333 }
# Game screenshots (Screenshots): grid 588px at 26,52, cells about 138x104px.
shots_grid = { x = 0.040625, y = 0.108333333, w = 0.91875, h = 0.791666667 }
# Switcher (Alternador): selected picture 400x300 at 120,52; the neighbours
# 240x180 at y 62, x the 30 px gap beside it; name, line and dots at 364.
switcher_card = { x = 0.1875, y = 0.108333333, w = 0.625, h = 0.625 }
switcher_side = { x = 0.046875, y = 0.129166667, w = 0.375, h = 0.375 }
switcher_info = { x = 0.0, y = 0.758333333, w = 1.0, h = 0.125 }
# Resume at power on (Retomar-boot): picture 320x240 at 160,53; texts below.
resume_shot = { x = 0.25, y = 0.110416667, w = 0.5, h = 0.5 }
resume_info = { x = 0.0, y = 0.6375, w = 1.0, h = 0.258333333 }

# Screen shapes: [aspect.square] (up to 6:5, the 720x720 R36 Plus),
# [aspect.classic] (4:3) and [aspect.wide] (from 29:20, 3:2 and 16:9) lay
# their keys over everything above, key by key; tables (views) merge.
# On a square screen the switcher and the resume pictures stay 4:3.
[aspect.square]
switcher_card = { x = 0.1875, y = 0.1, w = 0.625, h = 0.46875 }
switcher_side = { x = 0.046875, y = 0.19375, w = 0.375, h = 0.28125 }
switcher_info = { x = 0.0, y = 0.6, w = 1.0, h = 0.125 }
resume_shot = { x = 0.25, y = 0.15, w = 0.5, h = 0.375 }
resume_info = { x = 0.0, y = 0.58, w = 1.0, h = 0.258333333 }
# The Start menu's 640x480 composition centered between header and footer.
start_area = { x = 0.0, y = 0.1796875, w = 1.0, h = 0.75 }
# Covers keep a box-art shape: a narrower game list, a wider cover. The
# details picture and table share the column's height.
list_width = 0.5
cover = { x = 0.555, y = 0.1125, w = 0.41, h = 0.583333333 }
details_shot = { x = 0.0375, y = 0.104166667, w = 0.390625, h = 0.38 }
details_info = { x = 0.0375, y = 0.505, w = 0.390625, h = 0.38 }

# The console picture sits in the middle of the taller systems panel.
[aspect.square.view.lista.systems]
art = { y = 0.22, h = 0.36 }

[aspect.square.view.vitrine.games]
list = { w = 0.43 }
panel = { x = 0.51, w = 0.45, h = 0.62 }
art = { x = 0.51, w = 0.45, h = 0.62 }
meta = { x = 0.51, y = 0.78, w = 0.45 }

# On a 3:2 screen (480x320) the lists read in 13 px text: 19 px of reference.
[aspect.wide]
font_size = 0.039583333

# Sounds: the files in sounds/ named after each event play without any
# declaration. A [sounds] table is only needed to rename or silence one
# (move = "sounds/tick.wav", select = ""); see docs/temas.md.

# Views: [view.<id>] places the systems and games screens. "lista" is the
# classic layout above; other views start from it, key by key.
[view.lista]
name = { en = "List", pt_BR = "Lista", es = "Lista", ru = "Список" }

# Vitrine: immersive, the art leads.
[view.vitrine]
name = { en = "Showcase", pt_BR = "Vitrine", es = "Escaparate", ru = "Витрина" }

[view.vitrine.systems]
divider = false
summary = false
panel = false
art = false
list = { x = 0.0, y = 0.2, w = 1.0, h = 0.383333, row = 0.2, selected = 0.383333, gap = 0.045833, radius = 0.058333, mark = "tile" }
info = { x = 0.0375, y = 0.633333, w = 0.925, h = 0.15, title = 0.0625, meta = 0.029167, align = "center", valign = "top", details = "inline" }
dots = { x = 0.0, y = 0.816667, w = 1.0, h = 0.0125 }

[view.vitrine.games]
header = "compact"
divider = false
backdrop = { opacity = 0.55, solid = 0.42, edge = 0.6 }
list = { x = 0.0375, y = 0.133333, w = 0.46875, h = 0.683333, row = 0.070833, selected = 0.1, gap = 0.004167, font = 0.03125, selected_font = 0.045833, mark = "bar", scroll = "center" }
panel = { x = 0.58125, y = 0.133333, w = 0.36875, h = 0.658333, radius = 0.029167 }
art = { x = 0.58125, y = 0.133333, w = 0.36875, h = 0.658333, fit = "cover", radius = 0.027083 }
meta = { x = 0.58125, y = 0.816667, w = 0.36875, h = 0.041667, size = 0.025 }
