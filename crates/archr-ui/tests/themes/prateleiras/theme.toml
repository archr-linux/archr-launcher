# A test theme for the shelves (docs/temas.md, Prateleiras): the Ellegance
# colors and style over the default theme, and a view that opens on the
# shelves with the games as a grid. Not shipped; tests/home.rs draws it.
name = { en = "Shelves (test)", pt_BR = "Prateleiras (teste)" }

background = "#07070A"
text = "#F5F5F7"
text_secondary = "#A9A9B0"
muted = "#8E8E93"
dim_text = "#636366"
surface = "#16161C"
surface_elevated = "#1F1F27"
border = "#2A2A33"
accent = "#0A84FF"
accent_text = "#FFFFFF"

shadow_color = "#000000B0"
glass = { fill = "#FFFFFF17", border = "#FFFFFF21", highlight = "#FFFFFF29", blur = 0.05 }
focus = "lift"
focus_scale = 1.05
focus_ring = { color = "#F5F5F7EB", width = 2 }
motion = "spring"

[toast]
position = "top"
width = 0.75
icon = "circle"
style = "glass"

[hints]
style = "capsule"
position = "right"

[status]
style = "glass"
clock = "text"
rect = { x = 0.5, y = 0.012, w = 0.465, h = 0.09 }

[dialog]
width = 0.8
radius = 0.04
icon = true
buttons = "row"
style = "glass"

[start]
style = "control"

[menu]
style = "context"

[details]
style = "hero"

[achievements]
progress = { x = 0.05, y = 0.11, w = 0.9, h = 0.18, style = "ring" }
list = { x = 0.05, y = 0.32, w = 0.9, h = 0.56 }
style = "glass"
row = 0.1
badge = 0.075
badge_radius = 0.02

[saves]
style = "preview"
preview = { x = 0.05, y = 0.12, w = 0.5, h = 0.72 }
list = { x = 0.58, y = 0.12, w = 0.37, h = 0.72 }

[shots]
sections = true
columns = 4
gap = 0.025
radius = 0.025

[switcher]
cards = "depth"
card = { x = 0.22, y = 0.17, w = 0.56, h = 0.52 }
info = { x = 0.0, y = 0.74, w = 1.0, h = 0.14 }

[resume]
style = "title"

[search]
style = "field"

[keyboard]
sheet = true
key = { h = 0.075, gap = 0.0125, radius = 0.025 }

[view.prateleiras]
name = { en = "Shelves", pt_BR = "Prateleiras" }

[view.prateleiras.home.shelves]
order = ["continue", "systems", "apps"]

[view.prateleiras.games]
header = "compact"
list = { x = 0.05, y = 0.31, w = 0.9, h = 0.57, row = 0.2167, gap = 0.033, font = 0.025, radius = 0.029, mark = "grid", columns = 4 }
strip = { x = 0.05, y = 0.225, w = 0.9, h = 0.06 }
divider = false
art = false
panel = false
meta = false
backdrop = false
