<?xml version="1.0" encoding="UTF-8"?>
<systemList>
    <system>
        <name>3do</name>
        <fullname>3DO</fullname>
        <manufacturer>Panasonic</manufacturer>
        <release>1993</release>
        <hardware>console</hardware>
        <path>/storage/roms/3do</path>
        <extension>.ISO .bin .CHD .cue</extension>
        <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
        <platform>3do</platform>
        <theme>3do</theme>
        <emulators>
            <emulator name="retroarch">
                <cores>
                    <core default="true">opera</core>
                </cores>
            </emulator>
        </emulators>
    </system>
    <system>
        <name>amiga</name>
        <fullname>Amiga</fullname>
        <manufacturer>Commodore</manufacturer>
        <release>1985</release>
        <hardware>computer</hardware>
        <path>/storage/roms/amiga</path>
        <extension>  .ZIP   .adf
            .UAE	.lha  </extension>
        <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
        <platform>amiga</platform>
        <theme>amiga</theme>
        <emulators>
            <emulator name="retroarch">
                <cores>
                    <core default="false">puae</core>
                    <core>uae4arm</core>
                </cores>
            </emulator>
            <emulator name="amiberry">
                <cores>
                    <core default="true">amiberry</core>
                </cores>
            </emulator>
        </emulators>
    </system>
    <system>
        <name>nes</name>
        <fullname>Nintendo Entertainment System</fullname>
        <manufacturer>Nintendo</manufacturer>
        <release>1983</release>
        <hardware>console</hardware>
        <path>/storage/roms/nes</path>
        <extension>.nes .NES .zip .7z</extension>
        <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
        <platform>nes</platform>
        <theme>nes</theme>
        <emulators>
            <emulator name="retroarch">
                <cores>
                    <core>fceumm</core>
                    <core>nestopia</core>
                </cores>
            </emulator>
        </emulators>
    </system>
</systemList>
