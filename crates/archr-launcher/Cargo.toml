[package]
name = "archr-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
archr-io = { path = "../archr-io" }
archr-config = { path = "../archr-config" }
archr-ui = { path = "../archr-ui" }
sdl2 = { version = "0.38", features = ["ttf", "image"] }
archr-index = { path = "../archr-index" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
libc = "0.2"
