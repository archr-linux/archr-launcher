[package]
name = "archr-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
archr-io = { path = "../archr-io" }
archr-config = { path = "../archr-config" }
archr-ui = { path = "../archr-ui" }
sdl2 = { version = "0.38", features = ["ttf", "image", "mixer"] }
archr-index = { path = "../archr-index" }
archr-scraper = { path = "../archr-scraper" }
log = "0.4"
serde_json = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
